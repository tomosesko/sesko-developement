# Druga, neodvisna budilka za Supabase.
# Teče na GitHubovih strežnikih in ni odvisna od UptimeRobota.
# Dvakrat na dan pokliče bazo, da projekt nikoli ne doseže enega tedna neaktivnosti.
#
# Ključ spodaj je javni (publishable) in je itak že v index.html tega repozitorija,
# zato ga ni treba skrivati.

name: Budilka za bazo

on:
  schedule:
    - cron: "17 6,18 * * *"   # vsak dan ob 6:17 in 18:17 UTC
  workflow_dispatch:          # gumb za ročni zagon

jobs:
  zbudi:
    runs-on: ubuntu-latest
    steps:
      - name: Poklici Supabase
        run: |
          KODA=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://yoystbujxcdqxjrpmaow.supabase.co/rest/v1/zasedeno?select=id&limit=1&apikey=sb_publishable_rUmJa7jgyiqkHNALpDn3vA_tMnHVVGC")
          echo "Baza je odgovorila s kodo $KODA"
          test "$KODA" = "200"
